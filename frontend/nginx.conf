# Minimal SPA config: any path that doesn't match a real built file (JS/CSS/
# image chunk) falls back to index.html, so React Router can handle it
# client-side. Without this, a direct load or refresh on a route like
# /vendors/category/florist or /results would 404 - nginx would look for a
# literal file at that path, which doesn't exist; only the JS bundle knows
# how to route it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
